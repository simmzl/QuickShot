<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS menu-bar template image (rendered to assets/tray-icon.png, 44x44 px
       = 22pt @2x). Solid rounded square with the QuickShot bolt knocked out.
       The square is 30px (~15pt) so it optically matches the
       system status icons (e.g. Stage Manager, ~14pt). Pure black on
       transparent; the system tints it for light/dark menu bars. -->
  <defs>
    <mask id="bolt">
      <rect width="44" height="44" fill="#fff"/>
      <polygon points="23.33,10.83 13.83,24.67 21.5,24.67 20.67,33.17 30.17,19.33 22.5,19.33" fill="#000"/>
    </mask>
  </defs>
  <rect x="7" y="7" width="30" height="30" rx="8.33" fill="#000" mask="url(#bolt)"/>
</svg>
