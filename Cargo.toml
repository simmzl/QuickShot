[package]
name = "QuickShot"
version = "1.3.0"
edition = "2021"
description = "QuickShot — a small, fast screenshot daemon for macOS and Windows"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
arboard = "3.4"
fontdue = "0.9"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "0.8"
tray-icon = "0.22"
winit = "0.30"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"
core-graphics = "0.23"
core-foundation = "0.10"
# Native text editing (NSTextView) + AppKit text rasterization so the live
# editor and the exported PNG share one font stack. All three crates are
# already in the dependency graph via winit / softbuffer / tray-icon.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSGeometry", "NSObject", "NSRange", "NSDictionary",
    "NSAttributedString", "NSUndoManager", "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-core-graphics",
    "NSResponder", "NSView", "NSText", "NSTextView", "NSFont", "NSColor",
    "NSEvent", "NSWindow", "NSApplication", "NSGraphicsContext",
    "NSTextContainer", "NSLayoutManager", "NSTextStorage",
    "NSAttributedString", "NSStringDrawing", "NSColorSpace",
    "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage",
    "objc2-quartz-core", "NSWorkspace", "NSRunningApplication",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "CGBitmapContext", "CGContext", "CGColorSpace", "CGImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFCGTypes", "CFString", "CFBase", "CFDictionary", "CFNumber",
] }
# Zero-copy overlay presentation (see src/overlay/present.rs).
objc2-io-surface = { version = "0.3", default-features = false, features = [
    "std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2", "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std", "CALayer", "CATransaction", "objc2-core-foundation",
] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom", "Foundation", "UI_Notifications",
    "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT",
    "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Accessibility",
] }
windows-registry = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
] }

# Windows-only: embed the app icon into the .exe via build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
# Pixel-pushing hot loops (render.rs / annotate_render.rs) rely on LLVM
# auto-vectorization; opt-level 3 unlocks it. `strip`+`lto` keep the binary
# small enough for a menubar daemon despite the speed-first setting.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
