[package]
name = "QuickShot"
version = "1.1.6"
edition = "2021"
description = "QuickShot — a small, fast screenshot daemon for macOS and Windows"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
arboard = "3.4"
fontdue = "0.9"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "0.8"
tray-icon = "0.22"
winit = "0.30"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.10"

# Windows-only: embed the app icon into the .exe via build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
