[package]
name = "quickshot"
version = "1.1.0"
edition = "2021"
description = "Small, fast screenshot daemon for macOS and Windows"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
arboard = "3.4"
fontdue = "0.9"
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
toml = "0.8"
tray-icon = "0.22"
winit = "0.30"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.10"

[profile.release]
# Pixel-pushing hot loops (render.rs / annotate_render.rs) rely on LLVM
# auto-vectorization; opt-level 3 unlocks it. `strip`+`lto` keep the binary
# small enough for a menubar daemon despite the speed-first setting.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
