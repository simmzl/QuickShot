name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------- macOS: universal .app + .dmg ----------------
  build-macos:
    runs-on: macos-latest
    # Scope signing secrets to the `release` environment. Create it under
    # Settings → Environments and (optionally) add protection rules — required
    # reviewers / "selected tags only" — to gate access to the private cert.
    # Repo-level secrets are also inherited, so plain repo secrets work too.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run test suite
        run: cargo test

      # Import the Apple signing cert into an ephemeral keychain. Degrades to
      # ad-hoc signing when the secret is absent (forks, or before secrets are
      # configured), so the build never hard-fails on a missing cert. The
      # private key is decoded only inside the runner and deleted immediately;
      # the identity is exported as its SHA-1 hash (not the CN) and masked so
      # the signer's name/email never lands in the public build log.
      - name: Import signing certificate (if configured)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12_BASE64:-}" ]; then
            echo "No signing cert configured — packaging will use ad-hoc signing."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Put the ephemeral keychain first in the search list so codesign
          # resolves the identity, keeping the login/system keychains after it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/["]//g')
          rm -f "$CERT_PATH"
          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk '/[0-9]+\)/{print $2; exit}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "::error::cert imported but no codesigning identity found"
            exit 1
          fi
          echo "::add-mask::$IDENTITY_HASH"
          echo "SIGN_IDENTITY=$IDENTITY_HASH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Imported signing identity into ephemeral keychain."

      - name: Package .app + .dmg
        run: bash scripts/package.sh

      - name: Inspect artifacts
        run: |
          ls -lh dist/
          file dist/QuickShot.app/Contents/MacOS/QuickShot
          codesign --verify --verbose=2 dist/QuickShot.app

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/QuickShot-*.dmg
          if-no-files-found: error

      # Always tear down the ephemeral signing keychain, even on failure, so no
      # imported private key lingers on the runner.
      - name: Clean up signing keychain
        if: ${{ always() }}
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  # ---------------- Windows: MSVC .exe + .zip ----------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run test suite
        run: cargo test

      - name: Package .zip
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Inspect artifacts
        shell: pwsh
        run: Get-ChildItem dist -Recurse | Select-Object Length, FullName | Format-Table -AutoSize

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/QuickShot-*-windows-x64.zip
          if-no-files-found: error

  # ---------------- Publish a single GitHub Release ----------------
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected assets
        run: ls -lh dist/

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: QuickShot ${{ github.ref_name }}
          body: |
            ## Install (macOS)

            1. Download `QuickShot-<VERSION>.dmg` below.
            2. Open it and drag `QuickShot.app` to `Applications`.
            3. **First launch:** right-click the app → **Open** → **Open** in the Gatekeeper dialog. This is required once for any app without an Apple Developer ID signature.
            4. Grant **Screen Recording** permission on the first capture (System Settings → Privacy & Security → Screen Recording → enable QuickShot → relaunch).

            Universal binary (x86_64 + Apple Silicon), ad-hoc signed.

            ## Install (Windows)

            1. Download `QuickShot-<VERSION>-windows-x64.zip` below.
            2. Extract anywhere and double-click `QuickShot.exe`. The app lives in the system tray.
            3. SmartScreen may warn on first launch — click **More info → Run anyway**.

            x86_64 MSVC release, no console window.

            ## Use

            - Region capture: `Cmd+Shift+A` (macOS) / `Ctrl+Shift+A` (Windows). Drag → anchor adjust → Enter or double-click to confirm.
            - Full-screen capture: `Cmd+Shift+S` (macOS) / `Ctrl+Shift+S` (Windows).
            - Annotation tools while adjusting a region: `A` / `R` / `E` / `B` = Arrow / Rect / Ellipse / Mosaic, `M` = Move; `Cmd+Z` / `Ctrl+Z` undo, `Cmd+Shift+Z` / `Ctrl+Shift+Z` redo.
            - Tray menu: Capture Region/Screen, Edit Config, Start at Login, Quit.

            Config path: `~/.config/QuickShot/config.toml` (macOS) or `%APPDATA%\QuickShot\config.toml` (Windows). Edits are auto-reloaded within one second — no restart needed.
          files: |
            dist/QuickShot-*.dmg
            dist/QuickShot-*-windows-x64.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
